{% extends 'base.html' %}

{% block title %}Đổi mật khẩu thành công | Southern Land{% endblock %}

{% block content %}
<section class="sl-auth-page">
  <div class="sl-auth-decoration sl-auth-decoration-one"></div>
  <div class="sl-auth-decoration sl-auth-decoration-two"></div>

  <div class="sl-auth-container">
    <div class="sl-auth-brand">
      <span class="sl-auth-brand-mark">SL</span>
      <span>SOUTHERN <strong>LAND</strong></span>
    </div>

    <div class="sl-auth-card">
      <div class="sl-auth-heading">
        <span class="sl-about-eyebrow">HOÀN TẤT</span>
        <h1>Đổi mật khẩu thành công</h1>
        <p>Mật khẩu của bạn đã được cập nhật. Đăng nhập bằng mật khẩu mới.</p>
      </div>

      <p class="sl-auth-footer">
        <a href="{% url 'login' %}" class="sl-link-strong">Đi tới đăng nhập</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
